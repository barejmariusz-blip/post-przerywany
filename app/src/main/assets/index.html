  if(k==='paste') return `<h2>Wklej kopię</h2><div class="field"><textarea class="f" id="pasteTxt" placeholder="Wklej tu skopiowane dane"></textarea></div>
      <div class="btns"><button type="button" class="btn" data-act="close">Anuluj</button><button type="button" class="btn pri" data-act="pasteDo">Wczytaj</button></div>`;
  return '';
}
function refreshSheet(){if(ui.sheet) $('#sheetBody').innerHTML=sheetHtml(ui.sheet.kind,ui.sheet.data||{})}

/* ================= backup ================= */
function backupJson(){return JSON.stringify({app:'post-przerywany',v:1,exportedAt:now(),state:S})}
function doExport(){
  const name='post-przerywany-'+dkey(now())+'.json', data=backupJson();
  let ok=false;
  if(A&&A.saveFile){ok=String(A.saveFile(name,data,'application/json')).startsWith('ok'); toast(ok?'Zapisano w Pobranych: '+name:'Nie udało się zapisać pliku');}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();ok=true}
  if(ok){S.lastBackup=now();save();render()}
}
function importData(o){
  const st=o&&o.state?o.state:o;
  if(!st||!Array.isArray(st.fasts)) throw new Error('bad');
  S=Object.assign(S,st); save(); applyTheme(); closeSheet(); render(); toast('Wczytano kopię');
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v;
  switch(a){
    case 'tab': ui.tab=v; render(); window.scrollTo(0,0); break;
    case 'close': closeSheet(); break;
    case 'planSheet': openSheet('plan'); break;
    case 'plan': S.plan=v; save(); render(); refreshSheet(); break;
    case 'startSheet': openSheet('start'); break;
    case 'startQuick': $('#startAt').value=toLocal(now()-(+v)*MIN); t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t)); break;
    case 'startDo': {const at=fromLocal($('#startAt').value)||now(); closeSheet(); startFast(at); break}
    case 'editStart': openSheet('editStart'); break;
    case 'editStartDo': {const at=fromLocal($('#startAt').value); if(at&&at<=now()){S.cur.start=at; save();} closeSheet(); render(); break}
    case 'cancelFast': if(confirm('Anulować bieżący post bez zapisywania?')){S.cur=null; save(); closeSheet(); render();} break;
    case 'editGoal': openSheet('editGoal'); break;
    case 'goalSet': S.cur.goalH=+v; save(); closeSheet(); render(); break;
    case 'endSheet': ui.mood=null; openSheet('end'); break;
    case 'mood': ui.mood=+v; t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t)); break;
    case 'endDo': {const at=fromLocal(($('#endAt')||{}).value)||now(); const ok=S.cur&&(at-S.cur.start)>=S.cur.goalH*H-30e3; endFast(at,ui.mood,(($('#endNote')||{}).value||'').trim()); ui.mood=null; closeSheet(); render(); toast(ok?'Świetna robota! Post zapisany 🎉':'Post zapisany'); break}
    case 'water': {const k=dkey(now()); S.water[k]=Math.max(0,(S.water[k]||0)+(+v)*S.glass); save(); haptic(15); render(); break}
    case 'weightSheet': openSheet('weight'); break;
    case 'editWeight': openSheet('weight',{id:t.dataset.id}); break;
    case 'saveWeight': {const kg=num($('#wKg').value), d=new Date($('#wD').value+'T08:00').getTime();
      if(!kg||kg<25||kg>350||isNaN(d)){toast('Wpisz poprawną wagę');break}
      const id=t.dataset.id; if(id){const w=S.weights.find(x=>x.id===id); w.kg=kg; w.d=d} else {S.weights=S.weights.filter(w=>dkey(w.d)!==dkey(d)); S.weights.push({id:rid('w'),d,kg})}
      save(); closeSheet(); render(); break}
    case 'delWeight': S.weights=S.weights.filter(w=>w.id!==t.dataset.id); save(); closeSheet(); render(); break;
    case 'peerBw': {const d=PEER.bwAt; S.weights=S.weights.filter(w=>dkey(w.d)!==dkey(d)); S.weights.push({id:rid('w'),d,kg:PEER.bw}); save(); render(); toast('Dodano wagę z Dziennika FBW'); break}
    case 'peerBwNo': S.dismissedPeerBw=PEER.bwAt; save(); render(); break;
    case 'addFast': ui.mood=null; openSheet('fast',{}); break;
    case 'editFast': ui.mood=null; openSheet('fast',{id:t.dataset.id}); break;
    case 'saveFast': {const s=fromLocal($('#fS').value), en=fromLocal($('#fE').value), g=num($('#fG').value);
      if(!s||!en||en<=s||en>now()+MIN){toast('Sprawdź godziny startu i końca');break}
      if(en-s>14*DAY){toast('Post nie może trwać ponad 14 dni');break}
      const id=t.dataset.id; let f=id?S.fasts.find(x=>x.id===id):null; if(!f){f={id:rid('f')};S.fasts.push(f)}
      Object.assign(f,{start:s,end:en,goalH:g&&g>0?g:planObj().f,note:$('#fN').value.trim()||undefined}); if(ui.mood!=null) f.mood=ui.mood;
      ui.mood=null; save(); closeSheet(); render(); break}
    case 'delFast': if(confirm('Usunąć ten post?')){S.fasts=S.fasts.filter(f=>f.id!==t.dataset.id); save(); closeSheet(); render();} break;
    case 'calM': {const d=new Date(); ui.calM=(ui.calM||d.getFullYear()*12+d.getMonth())+(+v); render(); break}
    case 'more': ui.histN=(ui.histN||40)+40; render(); break;
    case 'wRange': ui.wRange=+v; render(); break;
    case 'sw': {const k=t.dataset.k; if(k==='sched') S.sched.on=!S.sched.on; else if(k==='schedRemind') S.sched.remind=!S.sched.remind; else S.notif[k]=!S.notif[k]; save(); render(); break}
    case 'schedPre': {const D=S.sched.days; if(v==='wk'){for(let d=0;d<7;d++)D[d]=(d===0||d===6)?'14:10':'16:8'} else if(v==='52'){for(let d=0;d<7;d++)D[d]=(d===1||d===4)?'20:4':'13:11'} else {for(let d=0;d<7;d++)D[d]=S.plan==='custom'?'16:8':S.plan} save(); render(); toast('Harmonogram ustawiony'); break}
    case 'askNotify': A&&A.askNotify(); break;
    case 'exact': A&&A.openExactSettings(); break;
    case 'theme': S.theme=v; save(); applyTheme(); render(); break;
    case 'openPeer': A&&A.openPeer&&A.openPeer(); break;
    case 'export': doExport(); break;
    case 'import': $('#fileIn').click(); break;
    case 'copy': {const d=backupJson(); if(A&&A.copy)A.copy(d); else navigator.clipboard&&navigator.clipboard.writeText(d); toast('Skopiowano dane'); break}
    case 'paste': openSheet('paste'); break;
    case 'pasteDo': try{importData(JSON.parse($('#pasteTxt').value))}catch(err){toast('To nie wygląda na kopię z tej aplikacji')} break;
    case 'food': ui.foodK=v||'ok'; openSheet('food'); break;
    case 'foodK': ui.foodK=v; refreshSheet(); $('#sheet').scrollTop=0; break;
    case 'stepsConnect': A&&A.stepsConnect&&A.stepsConnect(); break;
    case 'exInfo': openSheet('exInfo'); break;
    case 'badge': openSheet('badge',{i:+v}); break;
    case 'tipNext': ui.tipOff=(ui.tipOff||0)+1; render(); break;
    case 'onboardDo': S.onboarded=true; save(); closeSheet(); render(); if(A&&A.notifyState&&A.notifyState()==='ask') A.askNotify(); break;
  }
});
$('#scrim').addEventListener('click',()=>{if(ui.sheet&&ui.sheet.kind!=='onboard')closeSheet()});
document.addEventListener('change',e=>{
  const t=e.target, k=t.dataset&&t.dataset.k; if(!k) return;
  if(k==='before'||k==='winBefore'){S.notif[k]=+t.value}
  else if(k==='height'){const v=num(t.value);S.height=v&&v>80&&v<250?v:null}
  else if(k==='goalKg'){const v=num(t.value);S.goalKg=v&&v>25&&v<350?v:null}
  else if(k==='waterGoal'){const v=num(t.value);S.waterGoal=v&&v>=250&&v<=8000?Math.round(v):2000}
  else if(k==='glass'){S.glass=+t.value}
  else if(k==='stepGoal'){S.stepGoal=+t.value}
  else if(/^sd\d$/.test(k)){S.sched.days[k[2]]=t.value}
  else if(k==='startAt'){S.sched.startAt=t.value||'20:00'}
  else if(k==='customH'){const v=num(t.value);S.customH=v&&v>=10&&v<=96?Math.round(v):16}
  else return;
  save(); render();
});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const fr=new FileReader();
  fr.onload=()=>{try{importData(JSON.parse(fr.result))}catch(err){toast('Ten plik nie jest kopią z tej aplikacji')}}; fr.readAsText(f); e.target.value=''});

/* native hooks */
window.onBack=()=>{if(ui.sheet&&ui.sheet.kind!=='onboard'){closeSheet();return true} if(ui.tab!=='today'){ui.tab='today';render();return true} return false};
window.onNativeResume=()=>{loadPeer(); publish(); stepsFetch(); if(!ui.sheet) render()};
window.onNativeAction=act=>{
  ui.tab='today'; render();
  if(act==='start'&&!S.cur){const w=windowInfo(); openSheet('start',{at:w&&w.end<now()?w.end:now()})}
  if(act==='end'&&S.cur){ui.mood=null; openSheet('end')}
};

/* ================= boot ================= */
applyTheme(); loadPeer(); render(); syncNative(); stepsFetch();
setInterval(()=>{if(ui.tab==='today') tick()},1000);
let lastDay=dkey(now()); setInterval(()=>{if(dkey(now())!==lastDay){lastDay=dkey(now());render()}},60e3);
if(!S.onboarded&&!S.fasts.length&&!S.cur) openSheet('onboard');
else {try{const a=A&&A.takeAction&&A.takeAction(); if(a) window.onNativeAction(a)}catch(e){}}
window.addEventListener('resize',tick);
</script>
</body>
</html>
