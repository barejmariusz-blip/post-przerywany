plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'pl.mariusz.postprzerywany'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.mariusz.postprzerywany'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Same key as Dziennik FBW: both apps trust each other (signature permission) and every build installs as an update
    signingConfigs {
        release {
            storeFile file('fbw.keystore')
            storePassword 'dziennikfbw'
            keyAlias 'fbw'
            keyPassword 'dziennikfbw'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    kotlinOptions { jvmTarget = '17' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
